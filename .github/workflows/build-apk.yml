# Builds an installable Android APK on GitHub's servers, so no local
# Android Studio setup is needed. Trigger: push to main, or run manually
# from the Actions tab ("Run workflow"). Download the APK from the run's
# "Artifacts" section.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub's ubuntu-latest image already ships with the Android SDK.
      # This step points ANDROID_HOME at it, lists which platform / build-tools
      # / NDK packages the SDK manager actually offers (so a failure is easy
      # to diagnose), then installs the versions android/build.gradle asks for.
      - name: Install required Android SDK packages
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          echo "=== Available platforms (newest) ==="
          "$SDKMANAGER" --list 2>/dev/null | grep -E "^\s+platforms;android-" | tail -8 || true
          echo "=== Available build-tools (newest) ==="
          "$SDKMANAGER" --list 2>/dev/null | grep -E "^\s+build-tools;" | tail -5 || true
          echo "=== Available NDK 27.1 ==="
          "$SDKMANAGER" --list 2>/dev/null | grep -E "ndk;27\.1" || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" \
            || "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0" "ndk;27.1.12297006"

      - name: Install dependencies
        run: npm ci

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: todo-app-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

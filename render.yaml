# Render Blueprint: describes the backend web service so it can be deployed
# without filling in settings by hand. Secrets (MONGO_URI, JWT_SECRET) are
# marked sync:false, so Render asks for them at deploy time instead of
# reading them from the repository.
services:
  - type: web
    name: todo-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
